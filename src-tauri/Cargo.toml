[package]
name = "amaranth-attendance"
version = "0.1.0"
description = "아마란스 근태 엑셀 근무시간 계산 데스크탑 앱"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "amaranth_attendance_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
calamine = "0.36"
rust_xlsxwriter = "0.99"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
tauri-plugin-dialog = "2"
zip = "8.6.0"
hmac = "0.13.0"
sha2 = "0.11.1"
base64 = "0.23.1"
uuid = { version = "1.29.0", features = ["v4"] }
reqwest = { version = "0.13.5", features = ["json"] }
tokio = { version = "1.54.1", features = ["sync", "time"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
